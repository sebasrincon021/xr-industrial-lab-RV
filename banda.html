<style>


body{

background:#457b9d;

.info{

</head>

<!-- MENU -->


<div class="nav-menu">

<button onclick="entrarVR()">

</button>



<button onclick="entrarAR()">

📷 Entrar AR

</button>

<div class="info">


Sistema industrial XR<br>

Banda transportadora con sensores,
producto y panel de control.<br><br>

Compatible WebXR Meta Quest.


</div>









<a-scene


id="scene"


stats


vr-mode-ui="enabled:true"


webxr="optionalFeatures: local-floor, hit-test;"


embedded>







<!-- CAMARA -->


<a-camera

position="0 2 8">


</a-camera>







<!-- ILUMINACION -->


<a-light

type="ambient"

color="#BBB">

</a-light>



<a-light

type="directional"

color="#FFFFFF"

intensity="1"

position="2 5 3">

</a-light>







<!-- PISO -->


<a-plane


rotation="-90 0 0"


width="30"


height="30"


color="#EEEEEE">


</a-plane>










<!-- BASE DE LA BANDA -->


<a-box


position="0 0.35 -3"


width="8"


height="0.3"


depth="2"


color="#777">


</a-box>








<!-- BANDA AZUL -->


<a-box


position="0 0.55 -3"


width="7"


height="0.08"


depth="1"


color="#2196F3">


</a-box>









<!-- RODILLOS -->


<a-cylinder


position="-3.5 0.75 -3"


rotation="0 0 90"


radius="0.35"


height="1.2"


color="#555">


</a-cylinder>




<a-cylinder


position="3.5 0.75 -3"


rotation="0 0 90"


radius="0.35"


height="1.2"


color="#555">


</a-cylinder>









<!-- PRODUCTO -->


<a-box


position="0 1 -3"


width="0.8"


height="0.8"


depth="0.8"


color="#FF4444">


</a-box>










<!-- SENSOR VERDE -->


<a-cylinder


position="-4 1 -3"


radius="0.15"


height="1"


color="#00FF00">


</a-cylinder>










<!-- SENSOR AMARILLO -->


<a-cylinder


position="4 1 -3"


radius="0.15"


height="1"


color="#FFFF00">


</a-cylinder>









<!-- PANEL DE CONTROL -->


<a-box


position="5 1.5 -3"


width="1.5"


height="2"


depth="0.3"


color="#202040">


</a-box>





<a-sphere


position="4.6 1.8 -2.8"


radius="0.1"


color="red">


</a-sphere>




<a-sphere


position="5 1.8 -2.8"


radius="0.1"


color="yellow">


</a-sphere>




<a-sphere


position="5.4 1.8 -2.8"


radius="0.1"


color="green">


</a-sphere>










<!-- TITULO -->


<a-text


value="Banda transportadora industrial"


position="-2.5 3 -3"


color="black"


width="6">


</a-text>

</a-sky>







</a-scene>









<script>


let scene=document.querySelector("#scene");




// VR


function entrarVR(){


scene.enterVR();


}






// AR


async function entrarAR(){



try{


let session = await navigator.xr.requestSession(

"immersive-ar",

{

requiredFeatures:["hit-test"]

}

);



scene.renderer.xr.setSession(session);



}


catch(error){


alert(

"AR no disponible en este navegador"

);


}



}



</script>





</body>
